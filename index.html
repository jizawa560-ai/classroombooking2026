<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบจองโต๊ะ ป.6/1 (IEP 6)</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#2f8fe8;--sun:#ffc933;--mint:#2fbf71;--coral:#ff6b5b;--ink:#1d2b44;--bg:#eef7ff;--gray:#d9dfe7}
*{box-sizing:border-box}body{margin:0;font-family:Kanit,sans-serif;background:var(--bg);color:var(--ink)}
.page{display:none;min-height:100vh;padding:20px}.page.on{display:block}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 6px 0 #cfe3f7;max-width:460px;margin:8vh auto}
h1,h2{margin:0 0 12px}label{display:block;margin:12px 0 4px;font-weight:500}
input,select{width:100%;padding:12px;border:2px solid #cbd9ea;border-radius:12px;font:inherit}
.f{position:relative}.f i{position:absolute;right:12px;top:14px;font-style:normal}
button{font:inherit;border:0;border-radius:14px;padding:12px 18px;background:var(--sky);color:#fff;cursor:pointer;font-weight:500}
button.s{background:#fff;color:var(--ink);border:2px solid #cbd9ea}button.r{background:var(--coral)}button:disabled{opacity:.4}
.opt{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:500}.opt input{width:auto;margin:0;transform:scale(1.3)}
.err{color:var(--coral);font-size:14px;min-height:18px}
#bigtick{display:none;font-size:110px;text-align:center;color:var(--mint);animation:pop .6s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.purpose{display:block;width:100%;text-align:left;background:var(--sun);color:var(--ink);font-size:22px;margin:14px 0;padding:22px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.on{display:flex}.modal .card{margin:0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* หน้าห้องรอ */
#p3{background:#0a1f5c;color:#fff;text-align:center;padding-top:12vh}
#p3.red{background:#c4161c}#p3 h1{font-size:clamp(28px,6vw,56px)}
#cd{font-size:clamp(40px,11vw,140px);font-weight:700;text-shadow:0 0 18px #fff,0 0 42px #6cf}
#p3.red #cd{color:var(--sun);text-shadow:0 0 24px #ff0;animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.2)}}
/* หน้าจอง */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto 10px}
.badge{padding:6px 14px;border-radius:99px;background:var(--sun);font-weight:500}
.legend span{margin-right:12px;white-space:nowrap}.dot{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px}
.scroll{overflow:auto;padding-bottom:10px}
#room{display:grid;gap:8px;min-width:720px;max-width:900px;margin:0 auto;
 grid-template-columns:70px repeat(2,1fr) 18px repeat(3,1fr) 18px repeat(3,1fr) 70px}
.blk{border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;text-align:center}
.seat{position:relative;height:62px;border-radius:12px;background:var(--gray);color:var(--ink);padding:0;font-size:14px;box-shadow:0 3px 0 #b8c2cf}
.seat b{position:absolute;left:6px;top:3px;font-size:11px;opacity:.7}
.seat.hold{background:var(--sun)}.seat.booked{background:var(--mint);color:#fff;box-shadow:0 3px 0 #1f8f53}
.seat.mine{outline:3px solid var(--sky)}.seat:disabled{opacity:1;cursor:not-allowed}

/* ===== หัวเว็บ + ป้ายริบบิ้น (ตามแบบที่ส่งมา) ===== */
body{background:linear-gradient(180deg,#26385f 0%,#131f3a 100%) fixed;min-height:100vh}  /* กรมท่าเข้ม ดูเป็นทางการ */
#hdr{position:sticky;top:0;z-index:30;height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 6px 16px #0003}
.brand{display:flex;align-items:center;gap:10px}.brand img{height:50px}
.b1{font-size:20px;font-weight:500;border-bottom:2px solid var(--ink);display:inline-block;line-height:1.2}.b2{font-size:20px;line-height:1.2}
.who{display:flex;align-items:center;gap:12px;text-align:right}.w1{font-size:18px;font-weight:700}.w2{font-size:14px;font-weight:500}
#hout{background:none;padding:4px;border-radius:8px}#hout svg{width:38px;height:38px;display:block}
.ribbon{position:fixed;top:68px;left:24px;width:96px;padding:22px 6px 44px;z-index:20;text-align:center;color:#fff;font-weight:700;font-size:28px;line-height:1.3;pointer-events:none;
 background:linear-gradient(115deg,#e23c3c 0%,#ff7b7b 45%,#e23c3c 75%);clip-path:polygon(0 0,100% 0,100% calc(100% - 38px),50% 100%,0 calc(100% - 38px));
 text-shadow:0 2px 0 #0003;transform:translateY(-105%);transition:transform .8s cubic-bezier(.34,1.56,.64,1)}
.ribbon.on{transform:none}
#p4 h2,#p4 #who,#p4 .legend{color:#fff;text-shadow:0 1px 2px #0003}.badge{color:var(--ink)}
@media(max-width:640px){.b1,.b2{font-size:13px}.brand img{height:40px}.w1{font-size:13px}.w2{font-size:11px}#hout svg{width:30px;height:30px}.ribbon{width:66px;font-size:19px;left:8px}}
</style></head><body>

<script>
/* ===== ค่า config ที่เดียว ===== */
const CONFIG={
 OPEN_TIME:'2026-11-01T09:00:00+07:00',     // แก้เวลาเปิดจองได้ที่นี่
 BOOKING_WINDOW_MINUTES:2880,  // 2 วัน (48 ชม.) = ปิดจอง 3 พ.ย. 09:00 น.
 FULL_OPEN_DATE:'2026-11-03T00:00:00+07:00',
 MAX_SEATS_PER_USER:3, HOLD_SECONDS:60,
 FIREBASE:{apiKey:'AIzaSyCc9-EzTM3bdPfPngQPUegc5rhwxA-ZdJM',authDomain:'grade6-1-iep-anubanbmn.firebaseapp.com',projectId:'grade6-1-iep-anubanbmn',storageBucket:'grade6-1-iep-anubanbmn.firebasestorage.app',messagingSenderId:'241316372725',appId:'1:241316372725:web:c72a5e8ce736c955c125bc'}
};
const OPEN=Date.parse(CONFIG.OPEN_TIME),CLOSE=OPEN+CONFIG.BOOKING_WINDOW_MINUTES*6e4,FULL=Date.parse(CONFIG.FULL_OPEN_DATE);
firebase.initializeApp(CONFIG.FIREBASE);
const db=firebase.firestore(),$=id=>document.getElementById(id);
let offset=0,me=JSON.parse(localStorage.getItem('me')||'null'),seats={},tick;
const now=()=>Date.now()+offset;               // เวลาเซิร์ฟเวอร์ ไม่ใช่นาฬิกาเครื่อง
const phase=()=>{const t=now();return t<OPEN?'before':t<CLOSE?'open':(FULL>CLOSE&&t>=FULL)?'full':'closed'}; // ถ้า FULL ไม่เกิน CLOSE จะไม่มีช่วงเปิดเต็มรูปแบบ
const canBook=()=>['open','full'].includes(phase());
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const th=ms=>new Date(ms).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',dateStyle:'long',timeStyle:'short'});

/* ซิงก์เวลากับเซิร์ฟเวอร์ (ใช้ serverTimestamp) */
async function syncTime(){
 const r=db.collection('_t').doc(me?me.key:'x');
 const t0=Date.now();await r.set({t:firebase.firestore.FieldValue.serverTimestamp()});
 const s=await r.get();offset=s.data().t.toMillis()-(t0+Date.now())/2;
}
function show(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$('p'+n).classList.add('on');clearInterval(tick);
 $('hdr').style.display=n==3?'none':'flex';updHdr();
 setRibbon(n==1?'กรุณา<br>เข้าสู่<br>ระบบ':null);   // หน้าเข้าสู่ระบบ: ป้ายเลื่อนลงมา
 if(n==3)runCountdown();if(n==4)runSeats();}


/* ===== หัวเว็บและป้ายริบบิ้น ===== */
let ribKey=null;
function setRibbon(html){const k=html||'';if(k===ribKey)return;ribKey=k;const r=$('rb');
 if(html){r.innerHTML=html;r.classList.remove('on');void r.offsetWidth;r.classList.add('on')}else r.classList.remove('on')}
function updHdr(){$('hn').textContent=me?me.nick:'..........';$('hg').textContent=me?'ป.'+me.grade:'..........'}
$('hout').onclick=()=>{localStorage.removeItem('me');me=null;show(1)};

/* ===== หน้า 1 ===== */
for(let i=1;i<=6;i++)$('gr').add(new Option('ป.'+i,i,i==6,i==6));
const nameOk=v=>/^[ก-๙a-zA-Z\s.]{2,}$/.test(v.trim()) && v.trim().includes(' ');
const keyOf=v=>v.trim().replace(/\s+/g,' ').toLowerCase().replace(/\//g,'-');
function validate(){const a=nameOk($('fn').value),b=$('nn').value.trim().length>0;
 $('t1').textContent=a?'✅':'';$('t2').textContent=b?'✅':'';
 $('e1').textContent=$('fn').value&&!a?'กรอกชื่อและสกุลเป็นภาษาไทยหรืออังกฤษ คั่นด้วยเว้นวรรค':'';
 $('mk').disabled=!(a&&b);$('lg').style.display='none';return a&&b}
$('fn').oninput=$('nn').oninput=validate;
$('mk').onclick=async()=>{
 if(!validate())return;await ready;const key=keyOf($('fn').value);
 const ref=db.collection('accounts').doc(key),s=await ref.get();
 if(s.exists){$('e1').textContent='มีบัญชีชื่อนี้แล้ว';$('lg').style.display='';return}
 const d={fullName:$('fn').value.trim(),nick:$('nn').value.trim(),grade:$('gr').value,created:firebase.firestore.FieldValue.serverTimestamp()};
 await ref.set(d);finish(key,d)};
$('lg').onclick=async()=>{await ready;const key=keyOf($('fn').value),s=await db.collection('accounts').doc(key).get();finish(key,s.data())};
function finish(key,d){me={key,fullName:d.fullName,nick:d.nick,grade:d.grade};localStorage.setItem('me',JSON.stringify(me));
 $('bigtick').style.display='block';setTimeout(()=>{$('bigtick').style.display='none';goP2()},1200)}

/* ===== หน้า 2 ===== */
function goP2(){$('hi').textContent='สวัสดี '+me.nick+' 👋';show(2)}
$('pc').onclick=()=>$('pcOpt').style.display='flex';
$('out').onclick=()=>{localStorage.removeItem('me');me=null;show(1)};
$('how').onclick=()=>modal(`<h2>วิธีการใช้</h2><ol style="padding-left:20px;line-height:1.7">
<li>กดโต๊ะสีเทา แล้วกดยืนยัน</li><li>จองได้สูงสุด ${CONFIG.MAX_SEATS_PER_USER} โต๊ะ</li>
<li>เทา = ว่าง, เหลือง = กำลังจอง (ล็อก ${CONFIG.HOLD_SECONDS} วินาที), เขียว = จองแล้ว</li>
<li>เปิดจอง ${th(OPEN)} นาน ${CONFIG.BOOKING_WINDOW_MINUTES/1440} วัน (ถึง ${th(CLOSE)})</li>
<li>หลังหมดเวลา จองไม่ได้ แต่ดูผังได้${FULL>CLOSE?` จนถึง ${th(FULL)} ระบบเปิดเต็มรูปแบบ จองโต๊ะที่ว่าง เปลี่ยน หรือยกเลิกได้`:''}</li></ol>`,[['ปิด']]);
$('go').onclick=async()=>{await ready;show(phase()==='before'?3:4)};

/* ===== หน้า 3: นับถอยหลัง ===== */
function runCountdown(){
 $('cdmsg').textContent='เปิดจอง 1 พฤศจิกายน พ.ศ. 2569 เวลา 09:00 น. (เวลาประเทศไทย)';
 const loop=()=>{const left=OPEN-now();
  if(left<=0){clearInterval(tick);$('p3').classList.remove('red');return show(4)}
  const s=Math.ceil(left/1000);$('p3').classList.toggle('red',s<=10);
  if(s<=60){$('cd').textContent=s;$('cdmsg').textContent=''}
  else{const p=n=>String(n).padStart(2,'0');$('cd').textContent=`${p(Math.floor(s/86400))}:${p(Math.floor(s%86400/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`}};
 loop();tick=setInterval(loop,200)}
$('back').onclick=goP2;

/* ===== หน้า 4: ผังที่นั่ง ===== */
// สร้างผัง: คอลัมน์ 1=ล็อกเกอร์ 2-3=ซ้าย 4=ทางเดิน 5-7=กลาง 8=ทางเดิน 9-11=ขวา 12=ประตู
function buildRoom(){const R=$('room');R.innerHTML='';
 const B=(t,c,col,row,sp=1,rs=1)=>{const d=document.createElement('div');d.className='blk';d.textContent=t;
  d.style.cssText=`background:${c};grid-column:${col}/span ${sp};grid-row:${row}/span ${rs};min-height:44px`;R.appendChild(d)};
 B('กระดาน','#3a78c9',2,1,9);B('โต๊ะครู','#2fbf71',1,1);
 B('ล็อกเกอร์','#7d4fd6',1,2,1,5);B('ประตู','#e0323a',12,2);B('ประตู','#e0323a',12,6);
 B('ล็อกเกอร์','#7d4fd6',5,7,7);
 let n=1;
 for(let r=0;r<5;r++){const cols=[2,3,5,6,7,...(r==4?[9]:[]),10,11];
  cols.forEach(c=>{const b=document.createElement('button');b.className='seat';b.id='s'+n;b.dataset.n=n;
   b.style.cssText=`grid-column:${c};grid-row:${r+2}`;b.onclick=()=>pick(+b.dataset.n);R.appendChild(b);n++})}}
function stateOf(n){const s=seats[n];if(!s)return'free';
 if(s.status==='booked')return'booked';
 if(s.status==='hold'&&s.holdUntil>now())return'hold';return'free'}
function paint(){
 if(!$('p4').classList.contains('on'))return;
 let mine=0;for(let n=1;n<=36;n++){const s=seats[n],st=stateOf(n),b=$('s'+n);if(!b)return;
  if(st==='booked'&&s.ownerKey===me.key)mine++;
  b.className='seat '+(st==='free'?'':st)+(s&&s.ownerKey===me.key&&st!=='free'?' mine':'');
  b.innerHTML='<b>'+n+'</b>'+(st==='booked'?esc(s.label||s.nick):'');b.disabled=!canBook()||st==='booked'&&s.ownerKey!==me.key||st==='hold'&&s.ownerKey!==me.key;
  if(st==='booked')b.disabled=false;}   // กดดูชื่อเต็มได้เสมอ
 const p=phase(),m={before:'ยังไม่เปิดจอง',open:'กำลังเปิดจอง',closed:'ปิดจองชั่วคราว (ดูผังได้อย่างเดียว)',full:'เปิดทำการเต็มรูปแบบ'};
 let extra='';if(p==='open'){const l=Math.max(0,CLOSE-now());extra=` เหลือ ${Math.floor(l/6e4)}:${String(Math.floor(l/1e3)%60).padStart(2,'0')}`}
 $('st').textContent=m[p]+extra;$('cnt').textContent=`จองแล้ว ${mine}/${CONFIG.MAX_SEATS_PER_USER} โต๊ะ`;paint.mine=mine;
 setRibbon(mine>=CONFIG.MAX_SEATS_PER_USER?`จอง<br>ครบ<br>แล้ว<br>${mine}/${CONFIG.MAX_SEATS_PER_USER}`:null)}
function runSeats(){$('who').textContent=`${me.fullName} (${me.nick})`;buildRoom();
 db.collection('seats').onSnapshot(q=>{seats={};q.forEach(d=>{const x=d.data();x.holdUntil=x.holdUntil?x.holdUntil.toMillis():0;seats[+d.id]=x});paint()});
 tick=setInterval(paint,1000);paint()}

/* ทำรายการแบบ transaction: คนแรกที่เซิร์ฟเวอร์รับได้ชนะ */
async function tx(n,fn){const ref=db.collection('seats').doc(String(n));
 return db.runTransaction(async t=>{const s=await t.get(ref),d=s.exists?s.data():{};return fn(t,ref,d)})}
async function pick(n){
 const s=seats[n],st=stateOf(n);
 if(st==='booked'){
  const own=s.ownerKey===me.key;
  return modal(`<h2>โต๊ะ ${n}</h2><p>ผู้จอง: ${esc(s.fullName)} (${esc(s.nick)})</p>${s.forFriend?`<p>🎁 จองให้เพื่อน: <b>${esc(s.friendName)}</b></p>`:'<p>จองให้ตัวเอง</p>'}`,
   own&&canBook()?[['ยกเลิกการจอง',async()=>{await tx(n,(t,r)=>t.delete(r))},'r'],['ปิด']]:[['ปิด']])}
 if(!canBook())return;
 if(paint.mine>=CONFIG.MAX_SEATS_PER_USER)return modal('<h2>จองครบแล้ว</h2><p>จองได้สูงสุด '+CONFIG.MAX_SEATS_PER_USER+' โต๊ะ ยกเลิกโต๊ะเดิมก่อนจึงจะจองเพิ่มได้</p>',[['ตกลง']]);
 try{await tx(n,(t,r,d)=>{ // ถ้ามีคนจอง/กำลังจองก่อนแล้ว ให้ล้มเหลว
   if(d.status==='booked'||(d.status==='hold'&&d.holdUntil.toMillis()>now()&&d.ownerKey!==me.key))throw new Error('taken');
   t.set(r,{status:'hold',ownerKey:me.key,holdUntil:firebase.firestore.Timestamp.fromMillis(now()+CONFIG.HOLD_SECONDS*1000)})})}
 catch(e){console.error(e);return modal(e.message==='taken'?'<h2>โต๊ะนี้ถูกจองแล้ว</h2>':'<h2>จองไม่สำเร็จ</h2><p>'+(e.code||'')+' '+e.message+'</p>',[['ตกลง']])}
 modal(`<h2>จองโต๊ะหมายเลข ${n} ใช่หรือไม่</h2>
  <p style="margin:4px 0">หมายเหตุ: โต๊ะนี้จองให้ใคร</p>
  <label class="opt"><input type="radio" name="who" value="self" checked onchange="$('fname').style.display='none'"> จองให้ตัวเอง</label>
  <label class="opt"><input type="radio" name="who" value="friend" onchange="$('fname').style.display='block';$('fname').focus()"> จองให้เพื่อน</label>
  <input id="fname" placeholder="ชื่อเพื่อน (ชื่อเล่นหรือชื่อจริง)" maxlength="30" style="display:none">
  <div class="err" id="ferr"></div>`,[
  ['ยืนยัน',async()=>{const fr=document.querySelector('input[name=who]:checked').value==='friend',fname=$('fname').value.trim();try{await tx(n,(t,r,d)=>{
     if(d.status!=='hold'||d.ownerKey!==me.key||d.holdUntil.toMillis()<now()-2000)throw 0;
     t.set(r,{status:'booked',ownerKey:me.key,nick:me.nick,fullName:me.fullName,forFriend:fr,friendName:fr?fname:'',label:fr?fname:me.nick,bookedAt:firebase.firestore.FieldValue.serverTimestamp()})})}
   catch(e){console.error(e);modal(e&&e.code?'<h2>จองไม่สำเร็จ</h2><p>'+e.code+' '+e.message+'</p>':'<h2>หมดเวลาล็อกหรือโต๊ะถูกจองแล้ว</h2>',[['ตกลง']])}},
   undefined,  // ตรวจชื่อเพื่อนก่อนปิดป๊อปอัป: ถ้าเลือก "จองให้เพื่อน" ต้องกรอกชื่อ
   ()=>{const fr=document.querySelector('input[name=who]:checked').value==='friend',v=$('fname').value.trim();
    if(fr&&!v)return'กรุณากรอกชื่อเพื่อน';
    if(fr&&!/^[ก-๙a-zA-Z0-9\s.]{1,30}$/.test(v))return'ชื่อเพื่อนใช้ได้เฉพาะตัวอักษรไทย/อังกฤษ/ตัวเลข';return''}],
  ['ยกเลิก',async()=>{await tx(n,(t,r,d)=>{if(d.status==='hold'&&d.ownerKey===me.key)t.delete(r)})},'s']],
  async()=>{await tx(n,(t,r,d)=>{if(d.status==='hold'&&d.ownerKey===me.key)t.delete(r)}).catch(()=>{})});
}
function modal(html,btns,onDismiss){$('mt').innerHTML=html;$('mb').innerHTML='';
 btns.forEach(([t,f,c,chk])=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;
  b.onclick=async()=>{if(chk){const m=chk();if(m){const e=$('ferr');if(e)e.textContent=m;return}}$('md').classList.remove('on');if(f)await f()};$('mb').appendChild(b)});$('md').classList.add('on')}

/* ===== ดาวน์โหลด PNG 1920x1080 ===== */
$('dl').onclick=async()=>{await document.fonts.load('700 20px Kanit');
 const c=document.createElement('canvas');c.width=1920;c.height=1080;const x=c.getContext('2d');
 x.fillStyle='#eef7ff';x.fillRect(0,0,1920,1080);x.textAlign='center';x.textBaseline='middle';
 const W=1700,X0=110,col=(i)=>X0+W*i/12,cw=W/12-8,box=(c1,r,sp,rs,t,clr)=>{const px=col(c1-1),py=140+(r-1)*135;
  x.fillStyle=clr;x.beginPath();x.roundRect(px,py,cw*sp+(sp-1)*8+(sp-1)*(W/12-cw-8),130*rs+(rs-1)*5,14);x.fill();
  x.fillStyle='#fff';x.font='500 30px Kanit';x.fillText(t,px+(cw*sp+(sp-1)*(W/12-cw))/2,py+(130*rs)/2)};
 x.fillStyle='#1d2b44';x.font='700 48px Kanit';x.textAlign='left';x.fillText('ผังที่นั่ง ป.6/1 (IEP 6)',60,70);
 x.font='400 26px Kanit';x.textAlign='right';x.fillText('ดาวน์โหลดเมื่อ '+th(now()),1860,70);x.textAlign='center';
 // ใช้เลย์เอาต์เดียวกับหน้าจอ: อ่านตำแหน่งจริงจาก grid แล้ววาดสเกลขึ้น
 const room=$('room'),rb=room.getBoundingClientRect(),sx=1800/rb.width,sy=900/rb.height,sc=Math.min(sx,sy),ox=60+(1800-rb.width*sc)/2,oy=120;
 room.querySelectorAll('.blk,.seat').forEach(e=>{const r=e.getBoundingClientRect(),px=ox+(r.left-rb.left)*sc,py=oy+(r.top-rb.top)*sc,w=r.width*sc,h=r.height*sc;
  const isSeat=e.classList.contains('seat'),n=e.dataset.n,st=isSeat?stateOf(+n):'';
  x.fillStyle=isSeat?(st==='booked'?'#2fbf71':st==='hold'?'#ffc933':'#d9dfe7'):getComputedStyle(e).backgroundColor;
  x.beginPath();x.roundRect(px,py,w,h,12*sc);x.fill();
  if(isSeat){x.fillStyle=st==='booked'?'#fff':'#1d2b44';x.textAlign='left';x.font=`500 ${18*sc}px Kanit`;x.fillText(n,px+8,py+20*sc);
   x.textAlign='center';x.font=`700 ${24*sc}px Kanit`;if(st==='booked')x.fillText(seats[n].label||seats[n].nick,px+w/2,py+h/2+8)}
  else{x.fillStyle='#fff';x.font=`500 ${26*sc}px Kanit`;x.textAlign='center';x.fillText(e.textContent,px+w/2,py+h/2)}});
 const a=document.createElement('a');a.download='ผังที่นั่ง_6-1_IEP6.png';a.href=c.toDataURL('image/png');a.click()};

/* ===== เริ่มต้น: แสดงหน้าทันที แล้วค่อยเชื่อมต่อฐานข้อมูล ===== */
function bn(msg){let b=$('bn');if(!b){b=document.createElement('div');b.id='bn';
 b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#e0323a;color:#fff;padding:10px;text-align:center';document.body.prepend(b)}
 b.textContent=msg}
const timeout=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('หมดเวลาเชื่อมต่อ: ตรวจว่าสร้าง Firestore แล้ว และเปิดผ่านลิงก์เว็บ ไม่ใช่ไฟล์ในเครื่อง')),8000))]);
const ready=timeout(firebase.auth().signInAnonymously().then(()=>syncTime()),8000)
 .catch(e=>{bn('เชื่อมต่อฐานข้อมูลไม่ได้: '+(e.code||'')+' '+e.message);console.error(e);throw e});
ready.catch(()=>{});
me?goP2():show(1);
</script></body></html>
