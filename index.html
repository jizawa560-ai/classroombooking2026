<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Class Booking - Colorful Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/interact.js/1.10.11/interact.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: #f0f7ff; color: #2d3436; }
        .seat { 
            width: 85px; height: 85px; position: absolute; border: 4px solid #2d3436;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 20px; font-weight: 700; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 4px 4px 0px #2d3436;
        }
        .seat.available { background: #ffeaa7; color: #d35400; }
        .seat.occupied { background: #55efc4; color: #00b894; border-color: #00b894; cursor: not-allowed; }
        .seat.selected { background: #ff7675; color: #fff; transform: scale(1.1) rotate(3deg); z-index: 10; }
        .seat.dragging { opacity: 0.7; border-style: dashed; z-index: 50; }
        #room-canvas { 
            min-height: 750px; background: white; position: relative; 
            border: 6px solid #2d3436; border-radius: 40px;
            background-image: radial-gradient(#dfe6e9 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .lang-btn { padding: 6px 12px; border: 3px solid #2d3436; font-weight: bold; border-radius: 12px; background: white; }
        .lang-btn.active { background: #6c5ce7; color: white; box-shadow: 3px 3px 0px #000; }
        .modern-card { border: 4px solid #2d3436; border-radius: 24px; background: white; box-shadow: 8px 8px 0px #2d3436; }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="fixed inset-0 bg-[#a29bfe] z-[1000] flex items-center justify-center p-6">
    <div class="max-w-md w-full modern-card p-10 text-center">
        <div class="flex justify-end mb-4 gap-2">
            <button onclick="setLang('th')" class="lang-btn" id="lang-th-login">TH</button>
            <button onclick="setLang('en')" class="lang-btn" id="lang-en-login">EN</button>
        </div>
        <h1 class="text-4xl font-black italic mb-2 text-[#6c5ce7] uppercase" id="t-login-title">RESERVE FUN!</h1>
        <p id="thai-clock-login" class="text-sm font-bold text-gray-500 mb-8">00:00:00</p>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="NAME / ชื่อ" class="w-full p-4 border-4 border-black rounded-xl text-lg font-bold outline-none">
            <div class="flex gap-2">
                <button onclick="setRole('student')" id="role-std" class="flex-1 py-3 border-4 border-black rounded-xl bg-black text-white font-bold">STUDENT</button>
                <button onclick="setRole('admin')" id="role-adm" class="flex-1 py-3 border-4 border-black rounded-xl bg-white font-bold">ADMIN</button>
            </div>
            <div id="admin-auth" class="hidden"><input type="password" id="admin-pass" placeholder="SECRET KEY" class="w-full p-4 border-4 border-black rounded-xl bg-yellow-100"></div>
            <button onclick="handleLogin()" class="w-full py-5 bg-[#6c5ce7] text-white border-4 border-black rounded-xl text-xl font-black shadow-[4px_4px_0px_#000]" id="t-enter">ENTER</button>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
    <nav class="border-b-8 border-black p-6 flex justify-between items-center bg-[#fdcb6e] sticky top-0 z-[100]">
        <h2 class="text-3xl font-black italic text-white drop-shadow-md">PLAYFUL.BOOK</h2>
        <div class="flex items-center gap-4">
            <div class="bg-white px-4 py-1 border-4 border-black rounded-full font-bold hidden md:block" id="current-time">00:00:00</div>
            <button onclick="location.reload()" class="bg-[#ff7675] text-white px-4 py-2 border-4 border-black font-black rounded-xl text-xs" id="t-logout">LOGOUT</button>
        </div>
    </nav>

    <div class="flex flex-col lg:flex-row min-h-screen">
        <!-- Sidebar -->
        <aside class="w-full lg:w-96 border-b-8 lg:border-b-0 lg:border-r-8 border-black p-8 bg-white">
            <h3 class="text-xs font-black text-purple-400 mb-4 tracking-widest uppercase" id="t-select-room">SELECT ROOM</h3>
            <div id="room-nav" class="space-y-3"></div>
            <button id="add-room-btn" onclick="addNewRoom()" class="hidden w-full mt-4 py-3 border-4 border-dashed border-black rounded-xl font-black hover:bg-black hover:text-white transition">+ NEW ROOM</button>

            <div id="admin-panel" class="hidden mt-8 pt-8 border-t-4 border-purple-100 space-y-4">
                <button onclick="toggleEdit()" id="edit-btn" class="w-full py-4 bg-[#fab1a0] border-4 border-black rounded-xl font-black shadow-[4px_4px_0px_#000]" id="t-drag">DRAG MODE</button>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="applyTemplate('grid')" class="py-2 border-2 border-black rounded-lg text-xs font-bold bg-white">GRID</button>
                    <button onclick="applyTemplate('u')" class="py-2 border-2 border-black rounded-lg text-xs font-bold bg-white">U-SHAPE</button>
                </div>
                <button onclick="addSeat()" class="w-full py-2 bg-[#81ecec] border-2 border-black rounded-lg font-bold">+ ADD SEAT</button>
                <button onclick="clearRoom()" class="w-full py-2 border-2 border-red-500 text-red-500 font-bold rounded-lg uppercase">RESET ALL</button>
            </div>

            <div id="student-panel" class="mt-8">
                <div class="p-6 modern-card bg-[#f1f2f6]">
                    <h4 class="font-black text-xl text-[#6c5ce7] mb-2" id="t-my-selection">MY SELECTION</h4>
                    <p class="font-bold mb-4"><span id="t-seats-label">Seats</span>: <span id="seat-codes" class="text-pink-500 text-xl">-</span></p>
                    <button id="confirm-btn" onclick="finalizeBooking()" disabled class="w-full py-4 bg-[#6c5ce7] text-white border-4 border-black rounded-xl font-black shadow-[4px_4px_0px_#000] disabled:opacity-30" id="t-confirm">CONFIRM</button>
                    <button onclick="cancelSelection()" class="w-full mt-2 text-xs font-bold underline" id="t-cancel">Cancel Selection</button>
                </div>
            </div>
        </aside>

        <!-- Room Canvas -->
        <main class="flex-1 p-6 lg:p-10 overflow-auto">
            <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h1 id="room-name-display" class="text-5xl font-black uppercase text-[#2d3436]">ROOM</h1>
                        <p class="text-purple-400 font-bold text-xs uppercase" id="t-map-label">STATIONARY CLASSROOM MAP</p>
                    </div>
                </div>
                <div id="room-canvas">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 px-12 py-3 bg-[#2d3436] text-white font-black tracking-[0.5em] rounded-b-2xl text-xs" id="t-board">BOARD</div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
// --- DICTIONARY & CONFIG ---
const translations = {
    th: {
        login_title: "จองโต๊ะเรียน!", enter: "เริ่มใช้งาน", logout: "ออก", select_room: "เลือกห้องเรียน",
        drag: "โหมดจัดวาง", my_selection: "ที่นั่งที่คุณเลือก", seats_label: "หมายเลขโต๊ะ",
        confirm: "ยืนยันการจอง", cancel: "ยกเลิกที่เลือก", map_label: "แผนผังที่นั่งในห้องเรียน", board: "กระดานหน้าห้อง"
    },
    en: {
        login_title: "RESERVE FUN!", enter: "LET'S GO", logout: "LOGOUT", select_room: "SELECT ROOM",
        drag: "DRAG MODE", my_selection: "MY SELECTION", seats_label: "Seats",
        confirm: "CONFIRM", cancel: "Cancel selection", map_label: "STATIONARY CLASSROOM MAP", board: "BOARD"
    }
};

let currentLang = 'th';
const ADMIN_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; // "admin"

let state = {
    user: { name: '', role: 'student' },
    activeRoom: 'R1', isEdit: false, selected: [],
    rooms: { 
        'R1': { name: 'IT LAB', seats: generateSeats(12) },
        'R2': { name: 'STUDIO', seats: generateSeats(8) }
    }
};

function generateSeats(n) {
    let s = {};
    for(let i=1; i<=n; i++) s[i] = { x: (i-1)%4 * 120 + 150, y: Math.floor((i-1)/4) * 120 + 150, status: 'free' };
    return s;
}

// --- LOGIC FUNCTIONS ---
function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`lang-${lang}-login`).classList.add('active');
    const dict = translations[lang];
    document.getElementById('t-login-title').innerText = dict.login_title;
    document.getElementById('t-enter').innerText = dict.enter;
}

function setRole(r) {
    state.user.role = r;
    document.getElementById('role-std').className = `flex-1 py-3 border-4 border-black rounded-xl font-bold ${r==='student'?'bg-black text-white':'bg-white'}`;
    document.getElementById('role-adm').className = `flex-1 py-3 border-4 border-black rounded-xl font-bold ${r==='admin'?'bg-black text-white':'bg-white'}`;
    document.getElementById('admin-auth').classList.toggle('hidden', r !== 'admin');
}

function handleLogin() {
    const name = document.getElementById('username').value;
    if(!name) return alert("Please enter your name!");
    if(state.user.role === 'admin') {
        const pass = document.getElementById('admin-pass').value;
        if(CryptoJS.SHA256(pass).toString() !== ADMIN_HASH) return alert("Wrong Admin Password!");
    }
    state.user.name = name;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    if(state.user.role === 'admin') {
        document.getElementById('admin-panel').classList.remove('hidden');
        document.getElementById('add-room-btn').classList.remove('hidden');
        document.getElementById('student-panel').classList.add('hidden');
    }
    init();
}

function init() { renderNav(); renderCanvas(); updateClock(); }

function renderNav() {
    const nav = document.getElementById('room-nav');
    nav.innerHTML = '';
    Object.keys(state.rooms).forEach(id => {
        const btn = document.createElement('button');
        btn.className = `w-full p-4 border-4 border-black rounded-2xl font-black transition ${state.activeRoom===id?'bg-[#6c5ce7] text-white':'bg-white shadow-[4px_4px_0px_#000]'}`;
        btn.innerHTML = state.rooms[id].name;
        btn.onclick = () => { state.activeRoom = id; state.selected = []; renderNav(); renderCanvas(); };
        nav.appendChild(btn);
    });
}

function renderCanvas() {
    const canvas = document.getElementById('room-canvas');
    const room = state.rooms[state.activeRoom];
    document.getElementById('room-name-display').innerText = room.name;
    canvas.innerHTML = `<div class="absolute top-0 left-1/2 -translate-x-1/2 px-12 py-3 bg-[#2d3436] text-white font-black tracking-[0.5em] rounded-b-2xl text-xs uppercase">BOARD</div>`;

    Object.keys(room.seats).forEach(id => {
        const s = room.seats[id];
        const el = document.createElement('div');
        el.id = `s-${id}`;
        el.className = `seat ${s.status === 'booked' ? 'occupied' : (state.selected.includes(id) ? 'selected' : 'available')}`;
        if(state.isEdit) el.classList.add('dragging');
        el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
        el.innerHTML = `<span class="text-[10px] opacity-40">#${id}</span>`;
        if(!state.isEdit && s.status !== 'booked') el.onclick = () => selectSeat(id);
        canvas.appendChild(el);
    });
    updateUI();
}

function selectSeat(id) {
    const idx = state.selected.indexOf(id);
    if(idx > -1) state.selected.splice(idx, 1);
    else {
        if(state.selected.length >= 3) return alert("Maximum 3 seats allowed!");
        state.selected.push(id);
    }
    renderCanvas();
}

function finalizeBooking() {
    if(confirm("Confirm booking for: " + state.selected.join(', '))) {
        state.selected.forEach(id => state.rooms[state.activeRoom].seats[id].status = 'booked');
        state.selected = [];
        renderCanvas();
    }
}

function toggleEdit() {
    state.isEdit = !state.isEdit;
    document.getElementById('edit-btn').className = `w-full py-4 border-4 border-black rounded-xl font-black shadow-[4px_4px_0px_#000] ${state.isEdit?'bg-green-400':'bg-[#fab1a0]'}`;
    renderCanvas();
}

interact('.seat').draggable({
    listeners: {
        move(e) {
            if(!state.isEdit) return;
            const id = e.target.id.split('-')[1];
            state.rooms[state.activeRoom].seats[id].x += e.dx;
            state.rooms[state.activeRoom].seats[id].y += e.dy;
            e.target.style.left = state.rooms[state.activeRoom].seats[id].x + 'px';
            e.target.style.top = state.rooms[state.activeRoom].seats[id].y + 'px';
        }
    }
});

function addNewRoom() {
    const name = prompt("Enter Room Name:");
    if(name) {
        const id = 'R' + Date.now();
        state.rooms[id] = { name: name.toUpperCase(), seats: generateSeats(8) };
        state.activeRoom = id;
        init();
    }
}

function addSeat() {
    const room = state.rooms[state.activeRoom];
    const newId = Object.keys(room.seats).length + 1;
    room.seats[newId] = { x: 150, y: 150, status: 'free' };
    renderCanvas();
}

function applyTemplate(type) {
    const seats = state.rooms[state.activeRoom].seats;
    const ids = Object.keys(seats);
    ids.forEach((id, i) => {
        if(type === 'grid') { seats[id].x = (i%4)*120+150; seats[id].y = Math.floor(i/4)*120+150; }
        else { const angle = (i/ids.length)*Math.PI; seats[id].x = 450+300*Math.cos(angle-Math.PI); seats[id].y = 200+250*Math.sin(angle); }
    });
    renderCanvas();
}

function clearRoom() { if(confirm("Clear all bookings?")) { Object.keys(state.rooms[state.activeRoom].seats).forEach(id => state.rooms[state.activeRoom].seats[id].status = 'free'); renderCanvas(); } }
function updateUI() { document.getElementById('seat-codes').innerText = state.selected.join(', ') || '-'; document.getElementById('confirm-btn').disabled = state.selected.length === 0; }
function updateClock() { const now = new Date().toLocaleTimeString('th-TH'); document.getElementById('thai-clock-login').innerText = now; if(document.getElementById('current-time')) document.getElementById('current-time').innerText = now; setTimeout(updateClock, 1000); }
function cancelSelection() { state.selected = []; renderCanvas(); }

setLang('th');
</script>
</body>
</html>
